name: CI

# Se dispara en dos casos: cuando hay push directo a main (poco frecuente,
# porque la branch protection normalmente lo bloquea y obliga a pasar por PR),
# y en cualquier Pull Request, sin importar hacia qué rama vaya dirigido.
on:
  push: { branches: [main] }
  pull_request:

# Permisos a nivel de todo el workflow.
# contents: read -> necesario para que actions/checkout pueda clonar el repo.
# issues: write -> necesario para que el job notify-on-failure pueda crear
# un issue automáticamente cuando algo falla en main.
permissions:
  contents: read
  issues: write

jobs:
  # Job principal: valida que el código cumple los estándares de calidad
  # del proyecto (estilo, tipos) y que la lógica de negocio funciona.
  # Corre contra SQLite en memoria (rápido, no necesita levantar Postgres).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # descarga el código del repo al runner
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }  # misma versión que usamos en local y en Docker
      # requirements-dev.txt incluye requirements.txt (producción) + las
      # herramientas de desarrollo (pytest, ruff, mypy) vía "-r requirements.txt"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .  # revisa estilo y errores lógicos en todo el repo
      - name: Types
        run: mypy app --ignore-missing-imports  # solo valida tipos en app/, no en tests/ ni migrations/
      - name: Tests
        run: pytest  # corre pytest; --cov y --cov-fail-under=80 vienen de pyproject.toml

  # Job de integración real: valida que el flujo completo (Alembic + API)
  # funciona contra PostgreSQL de verdad, no solo contra SQLite (que es más
  # permisivo y puede esconder errores que sí truenan en producción).
  smoke-test:
    needs: test  # solo corre si "test" pasó, para no gastar minutos de CI en vano
    runs-on: ubuntu-latest
    services:
      # GitHub Actions levanta este contenedor de Postgres como un servicio
      # auxiliar, accesible en localhost desde los steps de este job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sensor
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sensorhub
        ports: ["5432:5432"]
        # Igual que el healthcheck de docker-compose: evita que los steps
        # siguientes intenten conectarse antes de que Postgres esté listo.
        options: >-
          --health-cmd "pg_isready -U sensor -d sensorhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Misma variable que lee get_database_url() en local/Docker — aquí
      # apunta a "localhost" porque el servicio postgres corre en el mismo
      # runner, no en una red Docker separada como en docker-compose.
      DATABASE_URL: postgresql+psycopg://sensor:secret@localhost:5432/sensorhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Aquí solo instalamos requirements.txt (sin dev tools) porque este
      # job simula producción, no necesita pytest/ruff/mypy.
      - run: pip install -r requirements.txt
      - name: Migraciones
        run: alembic upgrade head  # crea el esquema real en el Postgres del servicio
      - name: Levantar API
        # nohup + & la deja corriendo en segundo plano; el step termina
        # inmediatamente pero el proceso uvicorn sigue vivo para los
        # siguientes steps del mismo job.
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
      - name: Esperar a que la API responda
        # Uvicorn tarda un par de segundos en arrancar; este loop reintenta
        # /health hasta 10 veces (20s máx) antes de continuar.
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
      - name: Smoke test - crear sensor y lectura
        # Prueba de extremo a extremo real, sobre HTTP:
        # 1) crea un sensor y extrae su id de la respuesta JSON
        # 2) crea una lectura para ese sensor
        # 3) confirma que la lectura aparece al listarla
        # Si CUALQUIERA de estos pasos falla (curl -f), el job falla.
        run: |
          SENSOR_ID=$(curl -sf -X POST http://localhost:8000/sensors \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke Sensor","type":"temperature","location":"CI"}' \
            | python -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Sensor creado: $SENSOR_ID"
          curl -sf -X POST "http://localhost:8000/sensors/$SENSOR_ID/readings" \
            -H "Content-Type: application/json" \
            -d '{"value": 42.5, "unit": "C"}'
          curl -sf "http://localhost:8000/sensors/$SENSOR_ID/readings" | grep "42.5"

  # Job de seguridad: construye la imagen Docker real (la misma que se
  # despliega) y la escanea buscando vulnerabilidades conocidas (CVEs).
  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t sensorhub:ci .
      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sensorhub:ci"
          format: "table"
          exit-code: "1"        # si encuentra algo, el job falla (no solo informa)
          ignore-unfixed: true  # no falla por CVEs que aún no tienen parche disponible
          severity: "CRITICAL,HIGH"  # ignora vulnerabilidades de severidad baja/media

  # Si test, smoke-test o security-scan fallan Y el evento fue en main
  # (no en un PR), crea automáticamente un issue en el repo con el link
  # directo a la ejecución que falló.
  notify-on-failure:
    needs: [test, smoke-test, security-scan]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # Script de JS que corre con el contexto de GitHub disponible;
          # usa la API de Octokit para crear el issue con datos dinámicos
          # del commit y de la ejecución actual.
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI falló en main - commit ${context.sha.substring(0, 7)}`,
              body: `El pipeline de CI falló en la rama main.\n\nCommit: ${context.sha}\nEjecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci-failure"]
            })

  # Último job: solo corre si TODO lo anterior pasó, Y solo en push directo
  # a main (no en PRs, para no desplegar código que aún no fue mergeado).
  # "environment: production" lo ata al Environment configurado en GitHub
  # (restringido a la rama main), que es donde vive el secret usado abajo.
  deploy:
    needs: [test, smoke-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar despliegue en Render
        # POST al Deploy Hook de Render: le dice "despliega ahora" sin
        # exponer ninguna credencial en el código (vive como secret).
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"